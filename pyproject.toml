[project]
name = "textual-alpha"
version = "0.1.0"
description = "Point-in-time NLP/LLM textual alpha with rigorous leakage decomposition"
requires-python = ">=3.12"

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests", "shared"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "C4", "SIM"]
ignore = ["E501"]  # line length handled by formatter; long docstrings allowed

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = false
no_implicit_optional = true
files = ["src"]

# shared/ is a vendored reference toolkit (clean-room López de Prado / Bailey implementations) validated
# separately against skfolio/pypbo. Don't deep type-check it when src imports it.
[[tool.mypy.overrides]]
module = "shared.*"
follow_imports = "skip"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
